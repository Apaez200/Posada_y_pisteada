<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3202a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
  <title>Tanda Navideña 🎄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-admin="0">
  <div id="nieve" aria-hidden="true"></div>
  <noscript><p class="aviso">Activa JavaScript para ver la tanda.</p></noscript>

  <header class="hero">
    <h1>🎄 Tanda Navideña</h1>
    <p>$10 diarios de lunes a viernes · o $50 por semana</p>
    <p class="fin">Termina el viernes 18 de diciembre</p>
    <div id="cuenta" class="cuenta" aria-label="Cuenta regresiva"></div>
  </header>

  <div id="aviso" class="aviso" hidden></div>

  <main>
    <section class="resumen" aria-label="Resumen">
      <div class="card stat"><span id="totalGeneral">$0</span><small>Total juntado</small></div>
      <div class="card stat"><span id="metaPersona">$0</span><small>Meta por persona</small></div>
      <div class="card stat"><span id="diasRestantes">0</span><small>Días hábiles restantes</small></div>
    </section>

    <section class="card hoy-card"><p id="hoyTxt"></p></section>

    <section class="card arbol-card">
      <h2>🎄 El árbol de la tanda</h2>
      <div id="arbol" role="img" aria-label="Árbol de Navidad que se ilumina con los pagos del grupo"></div>
      <p id="arbolTxt" class="arbol-txt"></p>
    </section>

    <section id="podioCard" class="card" hidden>
      <h2>🏆 Podio</h2>
      <div id="podio" class="podio"></div>
    </section>

    <section class="card">
      <h2>📋 Avance de pagos</h2>
      <div id="lista"></div>
    </section>
  </main>

  <footer>
    <p>Hecho con 💚❤️ para la tanda de amigos</p>
    <a class="btn-login" href="admin.html">🔐 Iniciar sesión</a>
  </footer>

  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
